<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="420" viewBox="0 0 1400 420" role="img" aria-labelledby="title desc">
  <title id="title">Lê Hoàng Dũng GitHub profile banner</title>
  <desc id="desc">Elegant dark banner with data, machine learning, and finance motifs.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#07111F"/>
      <stop offset="45%" stop-color="#0B2240"/>
      <stop offset="100%" stop-color="#123C63"/>
    </linearGradient>
    <radialGradient id="glow1" cx="0.16" cy="0.20" r="0.55">
      <stop offset="0%" stop-color="#7C3AED" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#7C3AED" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.84" cy="0.78" r="0.58">
      <stop offset="0%" stop-color="#14B8A6" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#14B8A6" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#000000" flood-opacity="0.22"/>
    </filter>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#22D3EE"/>
      <stop offset="100%" stop-color="#14B8A6"/>
    </linearGradient>
  </defs>

  <rect width="1400" height="420" rx="30" fill="url(#bg)"/>
  <rect width="1400" height="420" rx="30" fill="url(#glow1)"/>
  <rect width="1400" height="420" rx="30" fill="url(#glow2)"/>
  <rect width="1400" height="420" rx="30" fill="url(#grid)"/>

  <g opacity="0.95">
    <path d="M915 275 C980 210, 1048 320, 1114 248 S1244 200, 1318 170" fill="none" stroke="url(#line)" stroke-width="4"/>
    <circle cx="915" cy="275" r="6" fill="#38BDF8"/>
    <circle cx="1114" cy="248" r="7" fill="#22D3EE"/>
    <circle cx="1318" cy="170" r="8" fill="#14B8A6"/>

    <path d="M958 108 L1002 132 L1040 95 L1089 124 L1136 80 L1188 105" fill="none" stroke="#C4B5FD" stroke-opacity="0.72" stroke-width="3"/>
    <circle cx="958" cy="108" r="4" fill="#C4B5FD"/>
    <circle cx="1002" cy="132" r="4" fill="#C4B5FD"/>
    <circle cx="1040" cy="95" r="4" fill="#C4B5FD"/>
    <circle cx="1089" cy="124" r="4" fill="#C4B5FD"/>
    <circle cx="1136" cy="80" r="4" fill="#C4B5FD"/>
    <circle cx="1188" cy="105" r="4" fill="#C4B5FD"/>

    <g opacity="0.80">
      <rect x="1048" y="300" width="13" height="26" rx="3" fill="#0EA5E9"/>
      <rect x="1070" y="281" width="13" height="45" rx="3" fill="#38BDF8"/>
      <rect x="1092" y="294" width="13" height="32" rx="3" fill="#67E8F9"/>
      <rect x="1114" y="262" width="13" height="64" rx="3" fill="#14B8A6"/>
      <rect x="1136" y="286" width="13" height="40" rx="3" fill="#34D399"/>
      <rect x="1158" y="250" width="13" height="76" rx="3" fill="#10B981"/>
    </g>
  </g>

  <g transform="translate(84 88)" filter="url(#shadow)">
    <text x="0" y="62" fill="#FFFFFF" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="62" font-weight="780" letter-spacing="-1.6">
      Lê Hoàng Dũng
    </text>
    <text x="3" y="110" fill="#CFE5F4" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="24" font-weight="600">
      Mathematics &amp; Informatics Undergraduate · HUST
    </text>
    <text x="3" y="148" fill="#E3F2FB" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20">
      Quantitative Research · Machine Learning · Data Systems
    </text>
    <text x="3" y="184" fill="#9CC1D8" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18">
      Building data-driven systems with practical engineering and measurable results
    </text>
  </g>

  <g transform="translate(86 292)" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15" font-weight="700">
    <g>
      <rect x="0" y="-24" width="160" height="40" rx="20" fill="#0E2D4D" stroke="#38BDF8" stroke-opacity="0.7"/>
      <text x="80" y="2" fill="#ECF8FF" text-anchor="middle">Quant Research</text>
    </g>
    <g transform="translate(174 0)">
