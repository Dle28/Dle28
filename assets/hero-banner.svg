      <text x="86" y="2" fill="#EEFFFF" text-anchor="middle">Machine Learning</text>
    </g>
    <g transform="translate(360 0)">
      <rect x="0" y="-24" width="142" height="40" rx="20" fill="#0E2D4D" stroke="#818CF8" stroke-opacity="0.7"/>
      <text x="71" y="2" fill="#F1F3FF" text-anchor="middle">Data Systems</text>
    </g>
    <g transform="translate(516 0)">
      <rect x="0" y="-24" width="132" height="40" rx="20" fill="#0E2D4D" stroke="#34D399" stroke-opacity="0.7"/>
      <text x="66" y="2" fill="#F0FFF8" text-anchor="middle">Blockchain</text>
    </g>
  </g>
