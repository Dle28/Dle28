<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" shape-rendering="crispEdges">
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="screenGlow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07130d"/>
      <stop offset="1" stop-color="#020504"/>
    </linearGradient>
  </defs>

  <!-- pure black background -->
  <rect width="1200" height="430" fill="#000000"/>

  <!-- subtle floor -->
  <rect x="80" y="360" width="1040" height="4" fill="#0f1720"/>
  <rect x="190" y="370" width="820" height="2" fill="#071018"/>

  <!-- ambient pixels -->
  <g filter="url(#glow)">
    <g fill="#20e3b2">
      <rect x="742" y="68" width="5" height="5"><animate attributeName="opacity" values=".15;1;.15" dur="2.2s" repeatCount="indefinite"/></rect>
      <rect x="812" y="42" width="4" height="4"><animate attributeName="opacity" values="1;.2;1" dur="1.7s" repeatCount="indefinite"/></rect>
      <rect x="930" y="86" width="5" height="5"><animate attributeName="opacity" values=".2;.9;.2" dur="2.8s" repeatCount="indefinite"/></rect>
      <rect x="1024" y="132" width="4" height="4"><animate attributeName="opacity" values=".9;.25;.9" dur="1.9s" repeatCount="indefinite"/></rect>
      <rect x="1080" y="236" width="5" height="5"><animate attributeName="opacity" values=".15;1;.15" dur="2.4s" repeatCount="indefinite"/></rect>
    </g>
    <g fill="#16bdf2">
      <rect x="694" y="112" width="4" height="4"><animate attributeName="opacity" values=".15;.8;.15" dur="2.5s" repeatCount="indefinite"/></rect>
      <rect x="972" y="54" width="3" height="8"><animate attributeName="opacity" values=".8;.2;.8" dur="1.8s" repeatCount="indefinite"/></rect>
    </g>
  </g>

  <!-- left monitor workstation -->
  <g transform="translate(105 78)">
    <rect x="0" y="38" width="410" height="248" rx="4" fill="#05080b" stroke="#172330" stroke-width="5"/>
    <rect x="18" y="56" width="374" height="196" fill="url(#screenGlow)" stroke="#0f5c57" stroke-width="2"/>
    <rect x="18" y="56" width="374" height="8" fill="#0c1918"/>
    <rect x="42" y="80" width="154" height="8" fill="#24f59b" opacity=".95"/>
    <rect x="42" y="98" width="246" height="7" fill="#0ba66f"/>
    <rect x="42" y="116" width="202" height="7" fill="#0f7257"/>
    <rect x="62" y="138" width="286" height="7" fill="#1ae089"/>
    <rect x="62" y="156" width="196" height="7" fill="#0c8760"/>
    <rect x="62" y="174" width="250" height="7" fill="#0a5b49"/>
    <rect x="42" y="198" width="130" height="7" fill="#13c77b"/>
    <rect x="42" y="216" width="78" height="7" fill="#28f6aa">
      <animate attributeName="opacity" values="1;.15;1" dur="1s" repeatCount="indefinite"/>
    </rect>

    <!-- monitor base -->
    <rect x="158" y="286" width="94" height="22" fill="#121820"/>
    <rect x="122" y="306" width="166" height="15" fill="#0b1015"/>
    <rect x="342" y="266" width="10" height="10" fill="#20e3b2" filter="url(#glow)"/>

    <!-- cat mug -->
    <rect x="-24" y="254" width="68" height="52" rx="3" fill="#0d1218" stroke="#1d2c39" stroke-width="3"/>
    <rect x="44" y="266" width="16" height="26" fill="none" stroke="#1d2c39" stroke-width="4"/>
    <rect x="-4" y="274" width="8" height="8" fill="#20e3b2"/>
    <rect x="22" y="274" width="8" height="8" fill="#20e3b2"/>
    <rect x="8" y="286" width="12" height="6" fill="#20e3b2"/>
    <path d="M2 246 C-8 232,10 224,2 210 M22 246 C12 232,30 224,22 210" stroke="#334155" stroke-width="4" fill="none" opacity=".65"/>

    <!-- tiny plant -->
    <rect x="50" y="12" width="42" height="28" fill="#101820" stroke="#1d2c39" stroke-width="3"/>
    <rect x="68" y="-2" width="6" height="18" fill="#2b8a63"/>
    <rect x="54" y="-10" width="18" height="8" fill="#2da96f"/>
    <rect x="72" y="-18" width="18" height="8" fill="#35c477"/>
  </g>

  <!-- chair behind cat -->
  <g transform="translate(745 116)">
    <rect x="26" y="54" width="176" height="184" rx="18" fill="#070a0f" stroke="#172330" stroke-width="5"/>
    <rect x="44" y="72" width="138" height="132" rx="12" fill="#0d131c"/>
    <rect x="66" y="226" width="16" height="100" fill="#101820"/>
    <rect x="148" y="226" width="16" height="100" fill="#101820"/>
  </g>

  <!-- improved pixel cat -->
  <g transform="translate(665 70)">
    <animateTransform attributeName="transform" type="translate" additive="sum" values="665 70;665 67;665 70" dur="3.1s" repeatCount="indefinite"/>

    <!-- tail -->
    <g transform="translate(224 174)">
      <animateTransform attributeName="transform" type="rotate" values="-8 18 18;10 18 18;-8 18 18" dur="1.7s" repeatCount="indefinite"/>
      <rect x="0" y="0" width="28" height="28" fill="#292a38"/>
      <rect x="20" y="-20" width="28" height="28" fill="#313342"/>
      <rect x="42" y="-42" width="28" height="28" fill="#393b4b"/>
      <rect x="62" y="-62" width="28" height="28" fill="#444658"/>
      <rect x="82" y="-72" width="26" height="26" fill="#d7c0c3"/>
      <rect x="88" y="-78" width="16" height="12" fill="#efe1d8"/>
    </g>

    <!-- body/hoodie -->
    <rect x="72" y="160" width="154" height="130" fill="#111722"/>
    <rect x="56" y="178" width="38" height="98" fill="#0b1018"/>
    <rect x="204" y="178" width="38" height="98" fill="#0b1018"/>
    <rect x="90" y="152" width="116" height="28" fill="#1a2230"/>
    <rect x="84" y="158" width="10" height="88" fill="#18b9e4" opacity=".55"/>
    <rect x="204" y="158" width="10" height="88" fill="#18b9e4" opacity=".55"/>
    <rect x="142" y="174" width="8" height="68" fill="#20e3b2"/>
    <rect x="128" y="236" width="36" height="10" fill="#0a0f16"/>

    <!-- chest fur -->
    <rect x="118" y="148" width="62" height="48" fill="#d7d3d0"/>
    <rect x="126" y="170" width="46" height="42" fill="#ede6df"/>

    <!-- head silhouette -->
    <rect x="72" y="44" width="154" height="128" fill="#303241"/>
    <rect x="88" y="28" width="124" height="144" fill="#393b4b"/>

    <!-- ears -->
    <polygon points="88,48 88,0 130,34" fill="#3b3d4e"/>
    <polygon points="212,48 212,0 170,34" fill="#3b3d4e"/>
    <polygon points="96,34 96,12 120,34" fill="#d5768e"/>
    <polygon points="204,34 204,12 180,34" fill="#d5768e"/>
    <polygon points="101,30 101,18 114,32" fill="#f1a5b5"/>
    <polygon points="199,30 199,18 186,32" fill="#f1a5b5"/>

    <!-- fur highlights -->
    <rect x="104" y="42" width="20" height="14" fill="#55586c"/>
    <rect x="130" y="36" width="18" height="12" fill="#4a4c5f"/>
    <rect x="154" y="36" width="18" height="12" fill="#4a4c5f"/>
    <rect x="178" y="42" width="20" height="14" fill="#55586c"/>
    <rect x="98" y="62" width="12" height="24" fill="#232532"/>
    <rect x="190" y="62" width="12" height="24" fill="#232532"/>
    <rect x="134" y="54" width="12" height="22" fill="#252735"/>
    <rect x="158" y="54" width="12" height="22" fill="#252735"/>

    <!-- muzzle -->
    <rect x="108" y="104" width="84" height="48" fill="#d8d1cc"/>
    <rect x="118" y="92" width="64" height="62" fill="#e7dfd8"/>
    <rect x="138" y="116" width="26" height="18" fill="#f29aaa"/>
    <rect x="144" y="126" width="14" height="10" fill="#e98398"/>
    <rect x="132" y="140" width="18" height="7" fill="#765761"/>
    <rect x="154" y="140" width="18" height="7" fill="#765761"/>

    <!-- eyes sockets -->
    <rect x="104" y="76" width="42" height="40" fill="#11141b"/>
    <rect x="164" y="76" width="42" height="40" fill="#11141b"/>
    <!-- eyes -->
    <rect x="112" y="82" width="28" height="28" fill="#28f6aa" filter="url(#glow)"/>
    <rect x="172" y="82" width="28" height="28" fill="#28f6aa" filter="url(#glow)"/>
    <rect x="120" y="86" width="12" height="20" fill="#06120e"/>
    <rect x="180" y="86" width="12" height="20" fill="#06120e"/>
    <rect x="114" y="84" width="7" height="7" fill="#efffff"/>
    <rect x="174" y="84" width="7" height="7" fill="#efffff"/>

    <!-- blink -->
    <g fill="#393b4b" opacity="0">
      <rect x="104" y="76" width="42" height="40"/>
      <rect x="164" y="76" width="42" height="40"/>
      <animate attributeName="opacity" values="0;0;1;0;0" keyTimes="0;.72;.75;.79;1" dur="4.2s" repeatCount="indefinite"/>
    </g>

    <!-- whiskers -->
    <g stroke="#f3f4f6" stroke-width="3" opacity=".8">
      <path d="M116 126 H58"/>
      <path d="M116 136 L62 148"/>
      <path d="M184 126 H242"/>
      <path d="M184 136 L238 148"/>
    </g>

    <!-- sleeves -->
    <rect x="62" y="222" width="58" height="48" fill="#111722"/>
    <rect x="184" y="222" width="58" height="48" fill="#111722"/>
    <rect x="68" y="230" width="10" height="30" fill="#16bdf2" opacity=".45"/>
    <rect x="226" y="230" width="10" height="30" fill="#16bdf2" opacity=".45"/>

    <!-- paws -->
    <g>
      <rect x="94" y="254" width="54" height="34" fill="#ddd5cf"/>
      <rect x="158" y="254" width="54" height="34" fill="#ddd5cf"/>
      <rect x="102" y="260" width="8" height="18" fill="#b9aea9"/>
      <rect x="116" y="260" width="8" height="18" fill="#b9aea9"/>
      <rect x="130" y="260" width="8" height="18" fill="#b9aea9"/>
      <rect x="166" y="260" width="8" height="18" fill="#b9aea9"/>
      <rect x="180" y="260" width="8" height="18" fill="#b9aea9"/>
      <rect x="194" y="260" width="8" height="18" fill="#b9aea9"/>
    </g>

    <!-- paw-print hoodie badge -->
    <g fill="#20e3b2" transform="translate(214 196)">
      <rect x="6" y="12" width="12" height="10"/>
      <rect x="0" y="4" width="6" height="6"/>
      <rect x="8" y="0" width="6" height="6"/>
      <rect x="16" y="4" width="6" height="6"/>
    </g>
  </g>

  <!-- keyboard -->
  <g transform="translate(640 338)">
    <rect x="0" y="0" width="310" height="34" rx="3" fill="#080c12" stroke="#172330" stroke-width="4"/>
    <g fill="#16bdf2" opacity=".8">
      <rect x="14" y="8" width="18" height="8"/><rect x="38" y="8" width="18" height="8"/><rect x="62" y="8" width="18" height="8"/>
      <rect x="86" y="8" width="18" height="8"/><rect x="110" y="8" width="18" height="8"/><rect x="134" y="8" width="18" height="8"/>
      <rect x="158" y="8" width="18" height="8"/><rect x="182" y="8" width="18" height="8"/><rect x="206" y="8" width="18" height="8"/>
      <rect x="230" y="8" width="18" height="8"/><rect x="254" y="8" width="18" height="8"/><rect x="278" y="8" width="18" height="8"/>
    </g>
    <g fill="#20e3b2">
      <rect x="28" y="20" width="38" height="7"><animate attributeName="opacity" values=".35;1;.35" dur="1.2s" repeatCount="indefinite"/></rect>
      <rect x="76" y="20" width="38" height="7"><animate attributeName="opacity" values="1;.35;1" dur="1.5s" repeatCount="indefinite"/></rect>
      <rect x="124" y="20" width="64" height="7"/>
      <rect x="198" y="20" width="38" height="7"><animate attributeName="opacity" values=".35;1;.35" dur="1.4s" repeatCount="indefinite"/></rect>
      <rect x="246" y="20" width="38" height="7"/>
    </g>
  </g>

  <!-- right-side mini devices -->
  <g transform="translate(1010 278)">
    <rect x="0" y="20" width="64" height="58" fill="#081019" stroke="#173042" stroke-width="3"/>
    <rect x="16" y="35" width="32" height="24" fill="#06110d"/>
    <rect x="22" y="42" width="6" height="6" fill="#20e3b2"/>
    <rect x="38" y="42" width="6" height="6" fill="#20e3b2"/>
    <rect x="28" y="54" width="10" height="5" fill="#20e3b2"/>
    <rect x="84" y="0" width="52" height="78" rx="4" fill="#071018" stroke="#173042" stroke-width="3"/>
    <rect x="104" y="28" width="14" height="14" fill="#16bdf2" filter="url(#glow)">
      <animate attributeName="opacity" values=".45;1;.45" dur="1.8s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- floating code symbols -->
  <g font-family="monospace" font-size="18" filter="url(#glow)">
    <text x="760" y="52" fill="#20e3b2" opacity=".8">01001001</text>
    <text x="916" y="92" fill="#16bdf2" opacity=".75">&lt; / &gt;</text>
    <text x="1008" y="185" fill="#20e3b2" opacity=".65">loss ↓</text>
    <animateTransform attributeName="transform" type="translate" values="0 6;0 -7;0 6" dur="5s" repeatCount="indefinite"/>
  </g>

  <!-- animated scanline -->
  <rect x="0" y="-16" width="1200" height="10" fill="#20e3b2" opacity=".035">
    <animate attributeName="y" values="-16;430;430" dur="5.4s" repeatCount="indefinite"/>
  </rect>

  <!-- status line -->
  <text x="92" y="405" font-family="monospace" font-size="15" fill="#667485">AI_LAB://CAT_PROCESS</text>
  <text x="275" y="405" font-family="monospace" font-size="15" fill="#20e3b2">RUNNING</text>
  <rect x="354" y="395" width="5" height="12" fill="#20e3b2">
    <animate attributeName="opacity" values="1;.1;1" dur="1s" repeatCount="indefinite"/>
  </rect>
</svg>