  <rect x="52" y="-54" width="84" height="48" fill="#080c12" stroke="#183f58" stroke-width="3"/>
  <rect x="64" y="-42" width="36" height="24" fill="#051419"/><rect x="69" y="-37" width="8" height="14" fill="#19d7ff"/><rect x="82" y="-34" width="5" height="10" fill="#39ff88"/><rect x="105" y="-39" width="6" height="17" fill="#39ff88"><animate attributeName="opacity" values="1;.15;1" dur="1.2s" repeatCount="indefinite"/></rect><rect x="116" y="-34" width="6" height="12" fill="#19d7ff"/>
  <!-- hanging plant -->
  <g transform="translate(137 8)"><path d="M18 0 V95" stroke="#17603e" stroke-width="4"/><g fill="#137a4b"><rect x="0" y="15" width="30" height="12" transform="rotate(-23 15 21)"/><rect x="10" y="34" width="34" height="12" transform="rotate(24 27 40)"/><rect x="-2" y="55" width="31" height="12" transform="rotate(-24 14 61)"/><rect x="9" y="76" width="30" height="12" transform="rotate(20 24 82)"/></g></g>
</g>

