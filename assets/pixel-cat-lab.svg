  <circle cx="26" cy="24" r="14" fill="#19d7ff" opacity=".9"/><circle cx="32" cy="18" r="14" fill="#040812"/>
  <g fill="#0a2a39"><rect x="15" y="65" width="18" height="47"/><rect x="39" y="48" width="22" height="64"/><rect x="67" y="58" width="14" height="54"/><rect x="86" y="39" width="17" height="73"/></g>
  <g fill="#39ff88"><rect x="20" y="74" width="4" height="5"/><rect x="20" y="89" width="4" height="5"/><rect x="45" y="58" width="4" height="5"/><rect x="53" y="72" width="4" height="5"/><rect x="71" y="69" width="4" height="5"/><rect x="92" y="49" width="4" height="5"/><rect x="92" y="64" width="4" height="5"/></g>
</g>

<!-- RIGHT GADGET -->
<g transform="translate(1046 375)">
  <rect x="0" y="34" width="50" height="50" fill="#080c12" stroke="#183f58" stroke-width="3"/>
  <g fill="#39ff88" filter="url(#glow)"><rect x="12" y="48" width="26" height="20"/><rect x="15" y="43" width="7" height="8"/><rect x="29" y="43" width="7" height="8"/><rect x="17" y="54" width="5" height="5" fill="#000"/><rect x="29" y="54" width="5" height="5" fill="#000"/><rect x="22" y="63" width="8" height="3" fill="#000"/></g>
