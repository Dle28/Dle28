<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360">
  <rect width="1200" height="360" fill="#0d1117"/>
  <rect x="20" y="20" width="1160" height="320" rx="4" fill="#0b1016" stroke="#30363d" stroke-width="3"/>

  <!-- terminal -->
  <rect x="54" y="58" width="650" height="242" fill="#05080c" stroke="#1f6feb" stroke-width="3"/>
  <rect x="54" y="58" width="650" height="34" fill="#111820"/>
  <rect x="70" y="70" width="10" height="10" fill="#ff7b72"/>
  <rect x="90" y="70" width="10" height="10" fill="#f2cc60"/>
  <rect x="110" y="70" width="10" height="10" fill="#39ff88"/>
  <text x="138" y="80" font-family="monospace" font-size="14" fill="#7d8590">~/projects/ai_lab</text>

  <g font-family="monospace" font-size="18">
    <text x="78" y="126" fill="#39ff88">$ python train.py</text>
    <text x="78" y="158" fill="#58a6ff">[01]</text><text x="126" y="158" fill="#c9d1d9">loading dataset...</text>
    <text x="78" y="190" fill="#58a6ff">[02]</text><text x="126" y="190" fill="#c9d1d9">building pipeline...</text>
    <text x="78" y="222" fill="#58a6ff">[03]</text><text x="126" y="222" fill="#c9d1d9">evaluating model...</text>
    <text x="78" y="254" fill="#39ff88">✓</text><text x="106" y="254" fill="#c9d1d9">experiment reproducible</text>
    <text x="78" y="282" fill="#d2a8ff">_</text>
  </g>

  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -2;0 0" dur="2.2s" repeatCount="indefinite"/>
    <!-- cat body -->
    <g transform="translate(805 132)">
      <rect x="28" y="34" width="112" height="88" fill="#d2a8ff"/>
      <rect x="40" y="18" width="88" height="82" fill="#e2c5ff"/>
      <!-- ears -->
      <rect x="40" y="0" width="24" height="30" fill="#e2c5ff"/>
      <rect x="104" y="0" width="24" height="30" fill="#e2c5ff"/>
      <rect x="46" y="5" width="12" height="15" fill="#ff9dbb"/>
      <rect x="110" y="5" width="12" height="15" fill="#ff9dbb"/>
      <!-- face -->
      <rect x="58" y="48" width="12" height="12" fill="#0d1117"/>
      <rect x="98" y="48" width="12" height="12" fill="#0d1117"/>
      <rect x="80" y="66" width="10" height="8" fill="#ff9dbb"/>
      <rect x="71" y="78" width="9" height="6" fill="#0d1117"/>
      <rect x="90" y="78" width="9" height="6" fill="#0d1117"/>
      <!-- blinking eyelids -->
      <rect x="58" y="48" width="12" height="12" fill="#e2c5ff" opacity="0">
        <animate attributeName="opacity" values="0;0;1;0;0" keyTimes="0;.72;.76;.8;1" dur="3.8s" repeatCount="indefinite"/>
      </rect>
      <rect x="98" y="48" width="12" height="12" fill="#e2c5ff" opacity="0">
        <animate attributeName="opacity" values="0;0;1;0;0" keyTimes="0;.72;.76;.8;1" dur="3.8s" repeatCount="indefinite"/>
      </rect>
      <!-- paws -->
      <rect x="46" y="112" width="28" height="20" fill="#e2c5ff"/>
      <rect x="96" y="112" width="28" height="20" fill="#e2c5ff"/>
      <!-- keyboard -->
      <rect x="16" y="132" width="142" height="12" fill="#1f6feb"/>
      <g fill="#58a6ff">
        <rect x="24" y="124" width="12" height="6"/><rect x="42" y="124" width="12" height="6"/><rect x="60" y="124" width="12" height="6"/>
        <rect x="78" y="124" width="12" height="6"/><rect x="96" y="124" width="12" height="6"/><rect x="114" y="124" width="12" height="6"/>
      </g>
      <!-- tail frame A -->
      <g>
        <rect x="140" y="84" width="18" height="18" fill="#d2a8ff"/>
        <rect x="156" y="68" width="18" height="18" fill="#d2a8ff"/>
        <rect x="172" y="52" width="18" height="18" fill="#d2a8ff"/>
        <animate attributeName="opacity" values="1;0;1" dur="1.2s" repeatCount="indefinite"/>
      </g>
      <!-- tail frame B -->
      <g opacity="0">
        <rect x="140" y="84" width="18" height="18" fill="#d2a8ff"/>
        <rect x="156" y="92" width="18" height="18" fill="#d2a8ff"/>
        <rect x="172" y="100" width="18" height="18" fill="#d2a8ff"/>
        <animate attributeName="opacity" values="0;1;0" dur="1.2s" repeatCount="indefinite"/>
      </g>
    </g>
  </g>

  <!-- floating code -->
  <g font-family="monospace" font-size="17" fill="#39ff88" opacity=".7">
    <text x="760" y="80">01001001</text>
    <text x="974" y="110">loss ↓</text>
    <text x="905" y="60">git commit</text>
    <animateTransform attributeName="transform" type="translate" values="0 8;0 -10;0 8" dur="5s" repeatCount="indefinite"/>
  </g>

  <!-- status bar -->
  <rect x="54" y="316" width="1092" height="4" fill="#21262d"/>
  <rect x="54" y="316" width="220" height="4" fill="#39ff88">
    <animate attributeName="width" values="140;780;220" dur="6s" repeatCount="indefinite"/>
  </rect>
  <text x="850" y="328" font-family="monospace" font-size="14" fill="#7d8590">CAT_PROCESS: RUNNING</text>
</svg>