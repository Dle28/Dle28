<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" shape-rendering="crispEdges" role="img" aria-label="Animated cyberpunk pixel cat coding in a dark AI lab">
<defs>
  <filter id="glow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="8"/></filter>
  <linearGradient id="crt" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#07180f"/><stop offset="1" stop-color="#010403"/></linearGradient>
  <linearGradient id="hoodie" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#121923"/><stop offset="1" stop-color="#05080d"/></linearGradient>
</defs>

<!-- PURE BLACK BACKGROUND -->
<rect width="1200" height="500" fill="#000000"/>
<ellipse cx="700" cy="458" rx="470" ry="18" fill="#00d9ff" opacity=".06" filter="url(#soft)"/>

<!-- FLOATING DIGITAL RAIN -->
<g opacity=".78" filter="url(#glow)">
  <g fill="#39ff88">
    <rect x="514" y="58" width="4" height="8"><animate attributeName="y" values="42;150;42" dur="4.7s" repeatCount="indefinite"/></rect>
    <rect x="514" y="78" width="4" height="4"><animate attributeName="y" values="62;170;62" dur="4.7s" repeatCount="indefinite"/></rect>
    <rect x="886" y="52" width="4" height="12"><animate attributeName="y" values="28;145;28" dur="5.2s" repeatCount="indefinite"/></rect>
    <rect x="886" y="75" width="4" height="5"><animate attributeName="y" values="51;168;51" dur="5.2s" repeatCount="indefinite"/></rect>
    <rect x="1007" y="89" width="5" height="5"><animate attributeName="opacity" values=".1;1;.1" dur="1.8s" repeatCount="indefinite"/></rect>
    <rect x="761" y="74" width="5" height="5"><animate attributeName="opacity" values="1;.15;1" dur="2.3s" repeatCount="indefinite"/></rect>
  </g>
  <g fill="#19d7ff">
    <rect x="566" y="38" width="4" height="4"><animate attributeName="opacity" values=".2;1;.2" dur="2.7s" repeatCount="indefinite"/></rect>
    <rect x="831" y="104" width="4" height="8"><animate attributeName="y" values="96;182;96" dur="3.9s" repeatCount="indefinite"/></rect>
    <rect x="953" y="48" width="4" height="4"><animate attributeName="opacity" values="1;.1;1" dur="2.1s" repeatCount="indefinite"/></rect>
  </g>
</g>

<!-- LEFT PLANTS -->
<g transform="translate(120 304)">
  <rect x="14" y="84" width="52" height="14" fill="#161b22"/>
  <rect x="22" y="98" width="36" height="30" fill="#080b0f" stroke="#244735" stroke-width="3"/>
  <g fill="#0b5d3a"><rect x="9" y="60" width="20" height="12"/><rect x="29" y="47" width="22" height="14"/><rect x="51" y="59" width="21" height="12"/><rect x="25" y="68" width="20" height="12"/></g>
  <g fill="#21b56d"><rect x="13" y="57" width="12" height="5"/><rect x="34" y="44" width="12" height="5"/><rect x="55" y="56" width="12" height="5"/></g>
</g>

<!-- CRT COMPUTER -->
<g transform="translate(235 150)">
  <rect x="0" y="18" width="330" height="224" rx="4" fill="#080c12" stroke="#16354b" stroke-width="5"/>
  <rect x="18" y="38" width="292" height="172" fill="url(#crt)" stroke="#11795f" stroke-width="3"/>
  <rect x="26" y="46" width="276" height="156" fill="#010302"/>
  <rect x="38" y="58" width="250" height="132" fill="#04110a" opacity=".8"/>
  <g font-family="monospace" font-size="11" fill="#39ff88">
    <text x="42" y="75">~/ai_lab $ python pipeline.py</text>
    <text x="42" y="94" fill="#19d7ff">[01]</text><text x="73" y="94">load_data()</text>
    <text x="42" y="111" fill="#19d7ff">[02]</text><text x="73" y="111">build_retriever()</text>
    <text x="42" y="128" fill="#19d7ff">[03]</text><text x="73" y="128">train_model()</text>
    <text x="42" y="145" fill="#19d7ff">[04]</text><text x="73" y="145">evaluate()</text>
    <text x="42" y="162" fill="#39ff88">✓ reproducible</text>
    <text x="42" y="181">ready_</text>
  </g>
  <rect x="87" y="218" width="136" height="11" fill="#0c1118"/>
  <rect x="145" y="221" width="22" height="5" fill="#39ff88" filter="url(#glow)"><animate attributeName="opacity" values=".25;1;.25" dur="1.5s" repeatCount="indefinite"/></rect>
  <rect x="34" y="250" width="270" height="26" fill="#080c12" stroke="#18232e" stroke-width="3"/>
  <g fill="#1c3840"><rect x="46" y="258" width="45" height="8"/><rect x="101" y="258" width="45" height="8"/><rect x="156" y="258" width="45" height="8"/></g>
  <circle cx="276" cy="263" r="5" fill="#39ff88"><animate attributeName="opacity" values=".2;1;.2" dur="2s" repeatCount="indefinite"/></circle>
  <!-- scanline -->
  <rect x="28" y="50" width="272" height="3" fill="#39ff88" opacity=".16"><animate attributeName="y" values="50;194;50" dur="4s" repeatCount="indefinite"/></rect>
  <!-- cursor -->
  <rect x="78" y="175" width="8" height="3" fill="#39ff88"><animate attributeName="opacity" values="1;1;0;0;1" dur="1s" repeatCount="indefinite"/></rect>
</g>

<!-- MONITOR TOP PLANT + MINI CAT -->
<g transform="translate(310 112)">
  <rect x="0" y="24" width="48" height="20" fill="#111820" stroke="#1e4b3a" stroke-width="2"/>
  <rect x="7" y="11" width="9" height="20" fill="#178c55" transform="rotate(-35 11 21)"/><rect x="30" y="8" width="9" height="22" fill="#21b56d" transform="rotate(35 34 19)"/><rect x="20" y="2" width="8" height="27" fill="#0d6a43"/>
  <g transform="translate(84 14)" fill="#39ff88" filter="url(#glow)"><rect x="0" y="8" width="28" height="20"/><rect x="3" y="2" width="7" height="9"/><rect x="18" y="2" width="7" height="9"/><rect x="5" y="13" width="5" height="5" fill="#000"/><rect x="18" y="13" width="5" height="5" fill="#000"/><rect x="11" y="20" width="6" height="3" fill="#000"/><animateTransform attributeName="transform" additive="sum" type="translate" values="0 0;0 -2;0 0" dur="2.4s" repeatCount="indefinite"/></g>
</g>

<!-- STEAMING CAT MUG -->
<g transform="translate(182 368)">
  <rect x="0" y="0" width="66" height="72" rx="3" fill="#090d12" stroke="#203748" stroke-width="3"/>
  <rect x="66" y="15" width="18" height="36" fill="none" stroke="#203748" stroke-width="5"/>
  <g fill="#39ff88" filter="url(#glow)"><rect x="17" y="23" width="34" height="27"/><rect x="20" y="16" width="8" height="10"/><rect x="40" y="16" width="8" height="10"/><rect x="23" y="31" width="5" height="5" fill="#000"/><rect x="40" y="31" width="5" height="5" fill="#000"/><rect x="31" y="41" width="7" height="3" fill="#000"/></g>
  <g fill="none" stroke="#8b949e" stroke-width="4" opacity=".55"><path d="M28 -8 C15 -22 38 -30 25 -45"><animate attributeName="d" values="M28 -8 C15 -22 38 -30 25 -45;M28 -8 C42 -22 18 -30 32 -45;M28 -8 C15 -22 38 -30 25 -45" dur="3s" repeatCount="indefinite"/></path><path d="M45 -4 C58 -17 35 -27 49 -40"><animate attributeName="d" values="M45 -4 C58 -17 35 -27 49 -40;M45 -4 C32 -17 57 -27 42 -40;M45 -4 C58 -17 35 -27 49 -40" dur="3.6s" repeatCount="indefinite"/></path></g>
</g>

<!-- CAT SHADOW -->
<ellipse cx="765" cy="442" rx="210" ry="22" fill="#00e5ff" opacity=".09" filter="url(#soft)"/>

<!-- CAT + HOODIE -->
<g id="cat" transform="translate(650 115)">
  <animateTransform attributeName="transform" type="translate" values="650 115;650 112;650 115" dur="3.5s" repeatCount="indefinite"/>
  <!-- tail behind body -->
  <g id="tail" transform="translate(214 215)">
    <path d="M0 82 H36 V66 H67 V45 H91 V24 H111 V5 H132 V20 H148 V44 H138 V70 H118 V91 H88 V107 H54 V118 H20 Z" fill="#151b27" stroke="#15c8e8" stroke-width="3"/>
    <path d="M92 25 H116 V10 H134 V26 H145 V46 H132 V61 H113 V72 H95 V56 H106 V42 H92 Z" fill="#d7c2b5"/>
    <animateTransform attributeName="transform" type="rotate" values="-2 0 82;5 0 82;-2 0 82" dur="2.2s" repeatCount="indefinite"/>
  </g>
  <!-- hoodie torso -->
  <path d="M42 205 L65 164 L105 144 L165 145 L207 166 L231 216 L225 304 L28 304 L24 245 Z" fill="url(#hoodie)" stroke="#123a51" stroke-width="4"/>
  <path d="M61 174 C80 138 192 132 207 176 L188 199 C160 176 103 176 78 199 Z" fill="#090d14" stroke="#17637c" stroke-width="4"/>
  <!-- head silhouette -->
  <path d="M64 51 L72 9 L104 36 L126 26 L151 29 L182 8 L190 55 L209 82 L204 132 L185 166 L155 184 L115 181 L83 163 L59 129 L55 84 Z" fill="#222838" stroke="#16d4f4" stroke-width="4"/>
  <!-- ears inner -->
  <path d="M77 24 L85 54 L105 40 Z" fill="#e78291"/><path d="M177 24 L169 54 L151 40 Z" fill="#e78291"/>
  <path d="M81 29 L87 47 L98 39 Z" fill="#f7b4b6"/><path d="M173 29 L167 47 L157 39 Z" fill="#f7b4b6"/>
  <!-- fur highlights -->
  <g fill="#394052"><rect x="112" y="40" width="8" height="21" transform="rotate(-18 116 50)"/><rect x="127" y="38" width="8" height="22"/><rect x="143" y="41" width="8" height="20" transform="rotate(18 147 50)"/><rect x="79" y="71" width="20" height="7" transform="rotate(-24 89 74)"/><rect x="168" y="70" width="20" height="7" transform="rotate(24 178 74)"/></g>
  <!-- eyes -->
  <ellipse cx="101" cy="94" rx="23" ry="29" fill="#05090c"/><ellipse cx="165" cy="94" rx="23" ry="29" fill="#05090c"/>
  <ellipse cx="102" cy="98" rx="16" ry="21" fill="#39ffb0" filter="url(#glow)"/><ellipse cx="164" cy="98" rx="16" ry="21" fill="#39ffb0" filter="url(#glow)"/>
  <ellipse cx="105" cy="99" rx="7" ry="15" fill="#04261c"/><ellipse cx="161" cy="99" rx="7" ry="15" fill="#04261c"/>
  <rect x="109" y="82" width="7" height="8" fill="#fff"/><rect x="168" y="82" width="7" height="8" fill="#fff"/>
  <!-- blinking eyelids -->
  <path d="M78 92 Q101 72 124 92 Q101 82 78 92" fill="#222838" opacity="0"><animate attributeName="opacity" values="0;0;1;0;0" keyTimes="0;.72;.76;.80;1" dur="4.4s" repeatCount="indefinite"/></path>
  <path d="M142 92 Q165 72 188 92 Q165 82 142 92" fill="#222838" opacity="0"><animate attributeName="opacity" values="0;0;1;0;0" keyTimes="0;.72;.76;.80;1" dur="4.4s" repeatCount="indefinite"/></path>
  <!-- muzzle -->
  <ellipse cx="116" cy="132" rx="30" ry="22" fill="#d8c6b8"/><ellipse cx="151" cy="132" rx="30" ry="22" fill="#d8c6b8"/>
  <path d="M125 121 L141 121 L133 132 Z" fill="#f08c91"/>
  <path d="M133 132 V141 M133 141 Q123 150 113 143 M133 141 Q143 150 153 143" fill="none" stroke="#151017" stroke-width="3"/>
  <!-- whiskers -->
  <g stroke="#dfe7ef" stroke-width="2" opacity=".88"><path d="M95 131 L40 119"/><path d="M96 139 L33 140"/><path d="M98 147 L47 160"/><path d="M171 131 L226 119"/><path d="M170 139 L233 140"/><path d="M168 147 L219 160"/></g>
  <!-- chest fluff -->
  <path d="M107 164 L119 187 L129 176 L138 197 L149 176 L158 188 L169 164 L163 213 L107 213 Z" fill="#c8b9ae"/>
  <!-- hoodie strings -->
  <g stroke="#39ff88" stroke-width="4"><path d="M102 190 V243"/><path d="M174 190 V243"/></g><rect x="97" y="239" width="10" height="12" fill="#39ff88"/><rect x="169" y="239" width="10" height="12" fill="#39ff88"/>
  <!-- sleeve paw logo -->
  <g transform="translate(198 218)" fill="#39ff88" filter="url(#glow)"><circle cx="12" cy="16" r="8"/><circle cx="4" cy="6" r="4"/><circle cx="12" cy="3" r="4"/><circle cx="20" cy="6" r="4"/></g>
  <!-- arms -->
  <path d="M64 219 C43 224 29 252 31 282 L72 291 L101 259 L99 222 Z" fill="#0b1018" stroke="#162d3d" stroke-width="4"/>
  <path d="M180 219 C203 223 220 247 222 278 L185 293 L157 259 L158 222 Z" fill="#0b1018" stroke="#162d3d" stroke-width="4"/>
  <!-- paws -->
  <g fill="#d8c6b8"><path d="M51 269 H93 L107 288 L95 307 H48 L34 291 Z"/><path d="M166 269 H208 L223 289 L210 307 H163 L150 289 Z"/></g>
  <g stroke="#7e6f6a" stroke-width="2"><path d="M61 282 V299"/><path d="M74 280 V300"/><path d="M87 282 V299"/><path d="M177 282 V299"/><path d="M190 280 V300"/><path d="M203 282 V299"/></g>
</g>

<!-- KEYBOARD -->
