  <path d="M0 0 H330 L351 31 H-18 Z" fill="#070b10" stroke="#15384a" stroke-width="4"/>
  <g fill="#19d7ff" opacity=".9">
    <rect x="15" y="9" width="23" height="6"/><rect x="44" y="9" width="23" height="6"/><rect x="73" y="9" width="23" height="6"/><rect x="102" y="9" width="23" height="6"/><rect x="131" y="9" width="23" height="6"/><rect x="160" y="9" width="23" height="6"/><rect x="189" y="9" width="23" height="6"/><rect x="218" y="9" width="23" height="6"/><rect x="247" y="9" width="23" height="6"/><rect x="276" y="9" width="23" height="6"/>
    <rect x="26" y="20" width="32" height="6"/><rect x="65" y="20" width="32" height="6"/><rect x="104" y="20" width="32" height="6"/><rect x="143" y="20" width="72" height="6"/><rect x="222" y="20" width="32" height="6"/><rect x="261" y="20" width="32" height="6"/>
    <animate attributeName="opacity" values=".45;1;.6;1;.45" dur="2.4s" repeatCount="indefinite"/>
  </g>
  <rect x="8" y="30" width="326" height="3" fill="#39ff88" opacity=".65" filter="url(#glow)"><animate attributeName="opacity" values=".2;.9;.2" dur="2s" repeatCount="indefinite"/></rect>
</g>

