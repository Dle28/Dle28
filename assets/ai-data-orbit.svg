<svg xmlns="http://www.w3.org/2000/svg" width="220" height="220" viewBox="0 0 220 220" role="img" aria-label="AI Data orbit">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#050B1C"/>
    </radialGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="50%" stop-color="#60A5FA"/>
      <stop offset="100%" stop-color="#A855F7"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      text { font-family: 'Segoe UI', Inter, Arial, sans-serif; }
      .orbitA { animation: spinA 9s linear infinite; transform-origin: 110px 110px; }
      .orbitB { animation: spinB 12s linear infinite; transform-origin: 110px 110px; }
      .node { animation: pulse 3.2s ease-in-out infinite; }
      .node.n2 { animation-delay: .8s; }
      .node.n3 { animation-delay: 1.6s; }
      .core { animation: corePulse 4s ease-in-out infinite; }
      @keyframes spinA { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
      @keyframes spinB { from { transform: rotate(360deg); } to { transform: rotate(0deg); } }
      @keyframes pulse { 0%,100% { opacity: .65; transform: scale(.95); } 50% { opacity: 1; transform: scale(1.12); } }
      @keyframes corePulse { 0%,100% { opacity: .9; } 50% { opacity: 1; } }
    </style>
  </defs>
  <rect x="8" y="8" width="204" height="204" rx="28" fill="url(#bg)" stroke="#1E3A8A" stroke-opacity=".45"/>
  <circle cx="110" cy="110" r="28" fill="#0B1227" stroke="url(#ring)" stroke-width="2.5" filter="url(#glow)"/>
  <text class="core" x="110" y="102" text-anchor="middle" font-size="16" font-weight="700" fill="#E0F2FE">AI</text>
  <text class="core" x="110" y="124" text-anchor="middle" font-size="13" fill="#A5F3FC">DS</text>
  <g class="orbitA" fill="none" stroke="url(#ring)" stroke-width="2" opacity=".85">
    <ellipse cx="110" cy="110" rx="66" ry="32"/>
    <circle class="node" cx="176" cy="110" r="6" fill="#22D3EE" stroke="none"/>
    <circle class="node n2" cx="44" cy="110" r="6" fill="#A855F7" stroke="none"/>
  </g>
  <g class="orbitB" fill="none" stroke="#60A5FA" stroke-width="2" opacity=".75">
    <ellipse cx="110" cy="110" rx="32" ry="66"/>
    <circle class="node n3" cx="110" cy="44" r="6" fill="#60A5FA" stroke="none"/>
    <circle class="node" cx="110" cy="176" r="6" fill="#22D3EE" stroke="none"/>
  </g>
  <g opacity=".85">
    <path d="M48 162 L78 142 L110 154 L142 132 L172 146" fill="none" stroke="#38BDF8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="48" cy="162" r="3.5" fill="#38BDF8"/>
    <circle cx="78" cy="142" r="3.5" fill="#60A5FA"/>
    <circle cx="110" cy="154" r="3.5" fill="#A855F7"/>
    <circle cx="142" cy="132" r="3.5" fill="#22D3EE"/>
    <circle cx="172" cy="146" r="3.5" fill="#38BDF8"/>
  </g>
</svg>
