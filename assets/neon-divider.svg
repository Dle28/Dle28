<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="24" viewBox="0 0 1200 24" role="img" aria-label="Neon divider">
  <defs>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="50%" stop-color="#60A5FA"/>
      <stop offset="100%" stop-color="#A855F7"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-200%" width="140%" height="500%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .pulse { animation: pulse 4s ease-in-out infinite; }
      .dash { stroke-dasharray: 10 12; animation: dashMove 8s linear infinite; }
      @keyframes pulse { 0%,100% { opacity: .65; } 50% { opacity: 1; } }
      @keyframes dashMove { from { stroke-dashoffset: 0; } to { stroke-dashoffset: -120; } }
    </style>
  </defs>
  <rect width="1200" height="24" fill="transparent"/>
  <path class="pulse" d="M20 12 H1180" stroke="url(#line)" stroke-width="2.5" stroke-linecap="round" filter="url(#glow)"/>
  <path class="dash" d="M150 12 H1050" stroke="#E0F2FE" stroke-opacity=".7" stroke-width="1.2" stroke-linecap="round"/>
  <circle class="pulse" cx="120" cy="12" r="3" fill="#22D3EE"/>
  <circle class="pulse" cx="600" cy="12" r="3" fill="#60A5FA"/>
  <circle class="pulse" cx="1080" cy="12" r="3" fill="#A855F7"/>
</svg>
