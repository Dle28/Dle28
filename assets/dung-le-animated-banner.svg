  <g class="titleGlow" filter="url(#textGlow)">
    <text x="790" y="232" text-anchor="middle" font-size="88" font-weight="800" fill="#E0F2FE" letter-spacing="-2">Dũng Lê</text>
    <text x="790" y="232" text-anchor="middle" font-size="88" font-weight="800" fill="#7DD3FC" opacity=".35" transform="translate(0,3)">Dũng Lê</text>
