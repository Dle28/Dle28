<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="420" viewBox="0 0 1400 420" role="img" aria-labelledby="title desc">
  <title id="title">Animated banner for Dũng Lê</title>
  <desc id="desc">A neon pixel-style animated banner with the name Dũng Lê, glowing stars, floating cubes, city skyline and a moving data trail.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#040818"/>
      <stop offset="48%" stop-color="#071B47"/>
      <stop offset="100%" stop-color="#0A2960"/>
    </linearGradient>
    <linearGradient id="frame" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="50%" stop-color="#60A5FA"/>
      <stop offset="100%" stop-color="#A855F7"/>
    </linearGradient>
    <linearGradient id="wave" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#60A5FA"/>
      <stop offset="100%" stop-color="#C084FC"/>
    </linearGradient>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="textGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
      .star { animation: twinkle 3.2s ease-in-out infinite; transform-origin:center; }
      .star.s2 { animation-delay: .8s; }
      .star.s3 { animation-delay: 1.6s; }
      .star.s4 { animation-delay: 2.2s; }
      .cube1 { animation: float1 5.5s ease-in-out infinite; }
      .cube2 { animation: float2 6.2s ease-in-out infinite; }
      .cube3 { animation: float3 4.8s ease-in-out infinite; }
      .titleGlow { animation: pulse 3.8s ease-in-out infinite; }
      .waveMove { stroke-dasharray: 8 12; animation: dashMove 8s linear infinite; }
      .bars rect { animation: bars 2.6s ease-in-out infinite; transform-box: fill-box; transform-origin: center bottom; }
      .bars rect:nth-child(2) { animation-delay: .2s; }
      .bars rect:nth-child(3) { animation-delay: .4s; }
      .bars rect:nth-child(4) { animation-delay: .15s; }
      .bars rect:nth-child(5) { animation-delay: .55s; }
      .bars rect:nth-child(6) { animation-delay: .3s; }
      .bars rect:nth-child(7) { animation-delay: .75s; }
      .bars rect:nth-child(8) { animation-delay: .5s; }
      .bars rect:nth-child(9) { animation-delay: .95s; }
      .bars rect:nth-child(10){ animation-delay: .65s; }
      .signalDot { animation: flow 4.5s linear infinite; }
      .signalDot.d2 { animation-delay: 1.5s; }
      .signalDot.d3 { animation-delay: 3s; }
      .network { animation: pulseNet 4.5s ease-in-out infinite; }
      @keyframes twinkle {
        0%,100% { opacity: .35; transform: scale(.9); }
        50% { opacity: 1; transform: scale(1.25); }
      }
      @keyframes float1 {
        0%,100% { transform: translateY(0px) translateX(0px); }
        50% { transform: translateY(-10px) translateX(4px); }
      }
      @keyframes float2 {
        0%,100% { transform: translateY(0px) translateX(0px); }
        50% { transform: translateY(11px) translateX(-5px); }
      }
      @keyframes float3 {
        0%,100% { transform: translateY(0px) translateX(0px); }
        50% { transform: translateY(-7px) translateX(-4px); }
      }
      @keyframes pulse {
        0%,100% { opacity: .92; }
        50% { opacity: 1; }
      }
      @keyframes dashMove {
        from { stroke-dashoffset: 0; }
        to { stroke-dashoffset: -120; }
      }
      @keyframes bars {
        0%,100% { transform: scaleY(.65); opacity: .75; }
        50% { transform: scaleY(1); opacity: 1; }
      }
      @keyframes flow {
        0% { opacity: 0; transform: translateX(-60px) translateY(20px); }
        15% { opacity: 1; }
        85% { opacity: 1; }
        100% { opacity: 0; transform: translateX(60px) translateY(-15px); }
      }
      @keyframes pulseNet {
        0%,100% { opacity: .7; }
        50% { opacity: 1; }
      }
      text { font-family: 'Segoe UI', Inter, Arial, sans-serif; }
    </style>
  </defs>

  <rect width="1400" height="420" rx="28" fill="url(#bg)"/>
  <rect width="1400" height="420" rx="28" fill="none" stroke="#0EA5E9" stroke-opacity=".08"/>

  <g fill="#FFFFFF">
    <circle class="star" cx="110" cy="70" r="2.2"/>
    <circle class="star s2" cx="268" cy="110" r="2"/>
    <circle class="star s3" cx="420" cy="52" r="2.7"/>
    <circle class="star s4" cx="632" cy="72" r="1.7"/>
    <circle class="star" cx="812" cy="58" r="2.3"/>
    <circle class="star s2" cx="960" cy="92" r="2"/>
    <circle class="star s3" cx="1180" cy="77" r="2.9"/>
    <circle class="star s4" cx="1262" cy="126" r="2.1"/>
    <circle class="star" cx="1022" cy="174" r="2.6"/>
