      <rect x="327" y="268" width="4" height="18"/><rect x="329" y="292" width="3" height="13"/>
      <rect x="384" y="284" width="4" height="15"/>
    </g>
    <g fill="#38BDF8">
      <rect x="54" y="164" width="5" height="3"/><rect x="54" y="174" width="5" height="3"/><rect x="54" y="184" width="5" height="3"/>
      <rect x="92" y="232" width="5" height="3"/><rect x="92" y="242" width="5" height="3"/>
      <rect x="157" y="252" width="5" height="3"/><rect x="157" y="262" width="5" height="3"/>
      <rect x="224" y="282" width="5" height="3"/><rect x="224" y="292" width="5" height="3"/>
