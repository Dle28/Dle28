      <circle cx="1358" cy="132" r="2.2"/><circle cx="1312" cy="156" r="2.2"/><circle cx="1248" cy="124" r="2.2"/>
      <circle cx="1202" cy="182" r="2.2"/><circle cx="1268" cy="210" r="2.2"/>
    </g>
