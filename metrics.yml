name: Generate Animated Metrics

on:
  schedule:
    # Chạy mỗi ngày lúc 01:00 UTC (~8:00 sáng giờ Việt Nam)
    - cron: "0 1 * * *"
  workflow_dispatch: {}
  push:
    branches:
      - main

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Generate main metrics.svg (calendar heatmap + activity + habits)
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          user: Dle28
          filename: metrics.svg
          template: classic
          base: header, activity, community, repositories, metadata
          config_timezone: Asia/Ho_Chi_Minh

          # --- Animated calendar heatmap (year view) ---
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

          # --- Coding habits (languages/hours pattern, animated bars) ---
          plugin_habits: yes
          plugin_habits_charts: yes
          plugin_habits_days: 14
          plugin_habits_facts: yes

          # --- Language breakdown ---
          plugin_languages: yes
          plugin_languages_analysis_timeout: 15
          plugin_languages_limit: 8
          plugin_languages_threshold: 0%

          # --- Recent activity list (commits, PRs, issues) ---
          plugin_activity: yes
          plugin_activity_limit: 5
          plugin_activity_days: 14

      - name: Generate isometric contribution calendar (standalone)
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          user: Dle28
          filename: isocalendar.svg
          template: classic
          base: ""
          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year
